[package]
name = "syntax-bridge-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]

[dev-dependencies]
# Used only by integration tests to validate CMake compile_commands.json
# structurally instead of with ad hoc text matching.
serde_json = "1"
# Used by integration tests to prove the server can generate C++ ASTs with
# tree-sitter using the same parser library it can later use at runtime.
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"

