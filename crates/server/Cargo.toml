[package]
name = "syntax-bridge-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
clang-sys = { version = "1.8", features = ["runtime", "clang_3_9"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }

[dev-dependencies]
# Used by integration tests to prove the server can generate C++ ASTs with
# tree-sitter using the same parser library it can later use at runtime.
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
