[package]
name = "syntax-bridge-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
# clang_17_0 (not just clang_3_9) is required for
# `clang_getCursorBinaryOperatorKind`, used by `lower::cpp` to read a
# BinaryOperator's actual operator instead of tokenizing source text for it.
# The installed libclang (18.1.3 on the dev host; the Flatpak's `llvm21`
# extension is newer still) resolves it fine at runtime via `runtime` — this
# feature only gates which bindings are compiled in, not what loads.
clang-sys = { version = "1.8", features = ["runtime", "clang_18_0"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `unbounded_depth`: `ProjectStore::list_ir`/`replace_ir` round-trip
# `ir::Function`/`ir::Record`, which nest `Expr`/`Stmt` through `Box` —
# real C++ (long chained expressions, deep conditionals) can nest past
# serde_json's default 128-level recursion limit even though the actual
# native call stack has room to spare; see persistence/project_store.rs.
serde_json = { version = "1", features = ["unbounded_depth"] }
shlex = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }

[dev-dependencies]
# Used by integration tests to prove the server can generate C++ ASTs with
# tree-sitter using the same parser library it can later use at runtime.
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
# Ingestion performance baseline (`benches/extraction.rs`): measures each of
# the four `libclang` extraction passes so a future change (e.g. folding
# them into one parse) has a real before/after number instead of an
# `#[ignore]`d diagnosis test's `eprintln!` timing.
criterion = "0.5"

[[bench]]
name = "extraction"
harness = false
