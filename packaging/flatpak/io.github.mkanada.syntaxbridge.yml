app-id: io.github.mkanada.syntaxbridge
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: syntax-bridge
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: syntax-bridge
    buildsystem: simple
    build-commands:
      - install -Dm755 syntax_bridge /app/syntax-bridge/syntax_bridge
      - cp -r data /app/syntax-bridge/data
      - cp -r lib /app/syntax-bridge/lib
      - install -Dm755 syntax-bridge-wrapper /app/bin/syntax-bridge
      - install -Dm644 io.github.mkanada.syntaxbridge.desktop /app/share/applications/io.github.mkanada.syntaxbridge.desktop
      - install -Dm644 io.github.mkanada.syntaxbridge.metainfo.xml /app/share/metainfo/io.github.mkanada.syntaxbridge.metainfo.xml
      - install -Dm644 io.github.mkanada.syntaxbridge.svg /app/share/icons/hicolor/scalable/apps/io.github.mkanada.syntaxbridge.svg
    sources:
      - type: dir
        path: ../../app/build/linux/x64/release/bundle
      - type: script
        dest-filename: syntax-bridge-wrapper
        commands:
          - cd /app/syntax-bridge
          - exec ./syntax_bridge "$@"
      - type: file
        path: io.github.mkanada.syntaxbridge.desktop
      - type: file
        path: io.github.mkanada.syntaxbridge.metainfo.xml
      - type: file
        path: io.github.mkanada.syntaxbridge.svg
